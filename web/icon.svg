<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="Unbake">
  <title>Unbake</title>
  <!--
    割れて開いた卵。**焼く前に戻る**を材料そのもので言う
    （2026-08-22 利用者が6案から選んだ）。ぎざぎざは殻の割れ目で、
    上の殻を少し持ち上げてある。

    **輪郭が閉じていて、内側に細い隙間を持たない。** 6案を実寸
    （16/20/32/72px）で並べて見て判ったのはそこで、細い線や
    「輪の中の塊」は 16px で溶ける。**候補は配布物に入れていない**
    ——残す価値があるのは絵ではなく、この条件のほうなので。

    **色を持たない。** `mask-image` として当て、色は `currentColor` から来る。
  -->
  <path d="M 6.7 8.9 C 6.7 5.1 9.1 1.6 12 1.6 C 14.9 1.6 17.3 5.1 17.3 8.9 L 15.4 7.5 L 13.3 9.2 L 11.2 7.5 L 9.1 9.2 Z" fill="#000"/>
  <path d="M 5.9 13.1 C 5.9 18.3 8.6 21.9 12 21.9 C 15.4 21.9 18.1 18.3 18.1 13.1 L 16 14.7 L 13.9 12.9 L 11.7 14.7 L 9.6 12.9 L 7.5 14.7 Z" fill="#000"/>
</svg>
