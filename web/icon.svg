<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="Unbake">
  <title>Unbake</title>
  <!--
    **一覧のカードに出る絵**（Registry / ComfyUI-Manager）。
    サイドバーの `icon-mask.svg` とは別ファイルにしてある。

    分けてある理由（2026-08-29 に2回踏んだ）:

      1回目 サイドバーと同じ絵を指していた。あちらは `mask-image` として当てるので
            中の色に意味が無く `#000`。カードは普通の画像として描くので、暗いカードの
            上で実測 1.52:1（ほぼ見えない）
      2回目 別ファイルを作って `pyproject.toml` の宣言を差し替えたが、カードは
            変わらなかった。**Registry は提出時の値を保持していて**、
            `api.comfy.org` が返す `icon` は `.../web/icon.svg` のままだった。
            動かせないのは指し先の方なので、**この URL が返す中身**をカード用にした。

    ※ XML はコメント内の 2連ハイフンを許さない。区切り線や CSS 変数名を
      そのまま書くと**ファイルごと読めなくなる**（それも同じ日に踏んだ）。

    · · ·

    **殻は白**（2026-08-29 利用者の指示）。板は素焼きの土の色。

    白い卵は板を濃くしないと形が潰れる。実測（板の一番明るい端で比べた値）:

        今までの青  #60a4f9   2.57   ← 白い卵では成立しない
        黄身       #e8a021   2.21   ← 同上
        紺        #2a6ed6   4.88
        深緑       #17796a   5.28
        素焼き      #b54826   5.36   ← これ
        墨        #3a3f4a  10.55   （対比は最強だが、暗いUIでは板が沈む）

    素焼きを採ったのは、**ComfyUI-Manager の一覧が青と灰色で埋まる**から。
    視認性は対比だけでなく「隣と違うか」でもある。窯で焼いた土の色は、
    この道具の名前とも噛み合う。

    · · ·

    **形そのものは変えていない。** 6案から選ばれた割れた卵のまま
    （`icon-mask.svg` と同じ座標の同じ path）。2026-08-29 に別の形を9案試して、
    どれも現行より悪かった: 戻り矢印は匙に見え、格子は小さいと泥になり、
    帯はメニューの記号に見え、殻の中の軸は顔に見え、計算で作り直した卵は
    尖りが消えて豆になった。**効いたのは造形ではなく、大きさ・階調・割れ目**で、
    卵を 0.72→0.86 倍にし、上の殻を 0.9 持ち上げて割れ目を見せている。
  -->
  <defs>
    <linearGradient id="unbake-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b54826"/>
      <stop offset="1" stop-color="#8e3417"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5" fill="url(#unbake-plate)"/>
  <g transform="translate(12 12.6) scale(0.86) translate(-12 -11.75)" fill="#ffffff">
    <g transform="translate(0 -0.9)">
      <path d="M 6.7 8.9 C 6.7 5.1 9.1 1.6 12 1.6 C 14.9 1.6 17.3 5.1 17.3 8.9 L 15.4 7.5 L 13.3 9.2 L 11.2 7.5 L 9.1 9.2 Z"/>
    </g>
    <path d="M 5.9 13.1 C 5.9 18.3 8.6 21.9 12 21.9 C 15.4 21.9 18.1 18.3 18.1 13.1 L 16 14.7 L 13.9 12.9 L 11.7 14.7 L 9.6 12.9 L 7.5 14.7 Z"/>
  </g>
</svg>
