<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="Unbake">
  <title>Unbake</title>
  <!--
    **一覧のカードに出る絵**（Registry / ComfyUI-Manager）。
    サイドバーの `icon.svg` とは**別ファイルにしてある。**

    分けた理由（2026-08-29 利用者の報告・画面写真つき「視認性が悪い」）:

      `icon.svg` は `mask-image` として当てる。色は `currentColor` から来るので
      **中の `fill` は何色でもよく**、たまたま `#000` にしてあった。
      ところが `pyproject.toml` の `Icon` が同じファイルを指しており、
      あちらは**普通の画像として描かれる**。実測すると、暗いカードの上で
      **1.52:1**（ページ地では 1.27:1）——ほぼ見えない。

    **1枚で両方は満たせない。** マスクは「背景の無い塗り一色の形」でなければ
    ならず（板を足すと四角い塊になる）、カードは「地の色が判らない場所で
    浮くこと」が要る。要求が正反対なので、ファイルを分ける。

    ---

    **配色は3案を測って選んだ**（WCAG の相対輝度比・地は4種）。
    形が読める＝「板と地」か「卵と地」のどちらかが立っていればよい、として
    **一番悪い地での値**で比べた:

        濃い青板＋白い卵     3.25:1
        中間の青板＋白い卵   3.25:1
        明るい青板＋暗い卵   5.37:1   ← これ

    卵と板の対比も 7.11:1 と一番高い（小さいときに形が潰れにくい）。
    暗い地では**板**が立ち、明るい地では**卵**が立つので、
    どちらへ置かれても消えない。

    板の色は面のアクセント（`--unbake-accent`）と同じ値にしてある
    ——カードと面で別の青が出ると、同じ道具に見えない。
  -->
  <rect width="24" height="24" rx="5" fill="#60a4f9"/>
  <!--
    卵は `icon.svg` と**同じ座標の同じ形**（見分けが付かないと別物に見える）。
    板の中へ収めるために 0.72 倍して中心へ寄せているだけ。
  -->
  <g transform="translate(12 12.4) scale(0.72) translate(-12 -11.75)" fill="#10151f">
    <path d="M 6.7 8.9 C 6.7 5.1 9.1 1.6 12 1.6 C 14.9 1.6 17.3 5.1 17.3 8.9 L 15.4 7.5 L 13.3 9.2 L 11.2 7.5 L 9.1 9.2 Z"/>
    <path d="M 5.9 13.1 C 5.9 18.3 8.6 21.9 12 21.9 C 15.4 21.9 18.1 18.3 18.1 13.1 L 16 14.7 L 13.9 12.9 L 11.7 14.7 L 9.6 12.9 L 7.5 14.7 Z"/>
  </g>
</svg>
