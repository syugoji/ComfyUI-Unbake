# 寄付の導線。**このファイルが無いと GitHub の Sponsor ボタンは出ない。**
#
# 【決定 2026-08-20 → 2026-08-23 → 2026-08-24 に改訂】**ko-fi ＋ PayPal 決済リンクの2本。**
# **PayPal.me は依然として保留**（下の行はコメントのまま。消さない）。
#
#   ko-fi     支払う側にアカウントが要らない。カードか PayPal で一回払い。
#             上流 ComfyUI-Lora-Manager も README の最初にこれを置いている。
#   PayPal    ノーコード決済リンク（**PayPal.me ではない**）。単価 US$1・数量で額を決める形。
#             **ko-fi という中継が1つ減る**——ko-fi 側の手数料・アカウント状態・出金規則が
#             経路から消え、支払う側から受け取り口座までが直接になる。
#
# **2本目を足した経緯**（`D-20260820-03`）。当初は「2本目が要る根拠を一度も測っていない」
# という理由で PayPal.me を保留にしていた。その判断自体は今も生きている——**下の2本は
# 入口が2つになっただけで、着く先は同じ PayPal ビジネス口座である**。だから
# 「着金するか」「引き出せるか」は**2本とも同時にしか進まない**。**入口を増やしても管は増えない。**
# （2026-08-24 実測で①②は2本とも通った。**残る③は口座側の話なので、どちらの入口でも同じ**）
#
# 規約は一次資料で確認済み（`PayPal利用規定ポリシー`・最終更新 2022-11-02）。
# **禁止行為の一覧に寄付は無く**、事前承認が要るのは
# 「**慈善団体または非営利組織として**寄付を募る行為」だけ。個人事業主が自分の道具の
# 支援を受けるのはこれに当たらない。**Stripe とはここが違う**——あちらは日本の禁止業種に
# 「個人への寄付」が入っていて用途ごと不可だった。
# **だから決済ページに「寄付」「募金」「donation」の語を置かないこと。** 使うのは `tip` / `support`。
#
# **GitHub Sponsors は採らない。** 支払う側に GitHub アカウントを要求するが、
# このツールの利用者は ComfyUI Manager 経由で来る趣味層で、GitHub の住人ではない。
# 実測でも、上流（支援者868名・v1.1.9 の README の表示値）は
# ko-fi / Patreon / PayPal / afdian の4本を並べていて **GitHub Sponsors を使っていない**。
#
# ------------------------------------------------------------------------
# ✅ **支払いと着金は2本とも検証済み。引き出しだけが未実測。**（2026-08-24）
# ------------------------------------------------------------------------
#
# 本人以外に US$1 を1回ずつ送ってもらって実測した（自己取引で弾かれる問題を避けるため。
# 作者自身のカードでは**支払う側と受け取る側が同一人物なので決済側が弾く**——
# 実測 `このカードを追加できませんでした`。**手順を書いた時点では想定していなかった**）。
#
#   ① 支援者側の決済が通るか  → **2本とも通った**（05:16 ko-fi / 05:18 PayPal 直リンク）
#   ② 着金するか              → **2本とも着金した**
#   ③ 引き出せるか            → **未実測**（下記の理由で、いまの残高では測れない）
#
# **実測した手取り（US$1 あたり）**
#
#   | 導線      | 支払額 | PayPal手数料 | パートナー手数料 | 正味   |
#   |-----------|-------:|-------------:|-----------------:|-------:|
#   | ko-fi     | $1.00  | -$0.34       | **-$0.05**       | $0.61  |
#   | PayPal直  | $1.00  | -$0.34       | なし             | $0.66  |
#
# **パートナー手数料 $0.05 = ko-fi の取り分 5%。** これが2本目を足す根拠である
# ——PayPal 直の方が**支援額の5%、手取り比で 8.2% 多く残る**。
# `D-20260820-03` が「2本目が要る根拠を一度も測っていない」と書いていた数字が、これ。
# PayPal 手数料 $0.34 は公表レート（海外受取 4.10% + $0.30）と**一致した**。
#
# **③ が未実測な理由——測れないのであって、飛ばしたのではない。**
# ビジネスアカウントの銀行口座への振替は **50,000円以上で無料 / 50,000円以下は250円**、
# さらに USD 残高を円口座へ移すと通貨換算が入り **基本為替レートに 3.00% 上乗せ**される
# （マーチャント手数料・最終更新 2026-01-22）。**残高 $1.27（約190円）に対して
# 手数料250円の方が大きい**ので、実行しても意味がない。
#
# **③ の本当の問いは「送金できるか」ではなく「屋号 `syugoji` と銀行口座の名義が
# 違ってよいか」である。これは引き出す前に測れる**——**名義の照合が起きるのは
# 銀行口座を登録する段階**だから。登録が通れば縛りは越えている。登録は無料で送金を伴わない。
#
# **だから、ここから先を読む人へ。** ①②が通ったので「支援が0＝導線が落ちている」は
# もう既定の疑いではない。**ただし③が残っている以上、「着金はするが引き出せない」
# を開通と誤認する余地はまだある。** 引き出しまで通ったら、その日付・実額・
# 名義が一致していたかどうかをここへ書き足すこと。
# 詳しい経緯と完了条件は `_Planning/decisions/D-20260820-03.md`。

ko_fi: syugoji
custom: ['https://www.paypal.com/ncp/payment/Q3YJJVB5LNEML']
# PayPal.me は保留のまま（2本目が要る根拠を測っていない。上の custom は PayPal.me ではない）
# custom: ['https://paypal.me/<PayPal.me の名前>']
