[project]
name = "comfyui-unbake"
description = "Rebuild the ComfyUI workflow behind an image, then sweep one axis at a time and compare."
version = "0.1.2"
license = { file = "LICENSE" }
# **依存は無い。** `folder_paths` は ComfyUI 本体が、`PIL` は ComfyUI の環境が供給する。
# ここへ何か足すときは、そのライセンスが配布物へ乗ることを先に確かめること。
#
# **同梱の `civitai_recipe_sync/` は `requests` を使うが、ここには足さない。**
# ComfyUI 本体の `requirements.txt` に `requests` が在る（実測 2026-08-25・27行目）ので、
# `PIL` と同じ「宿主が供給するもの」に当たる。**名前だけ見て宿主だと決めない**——
# 足す前に本体の `requirements.txt` を実際に見ること（別の拡張が入れたものを
# 宿主のものだと思い込む事故が起こりうる）。
#
# **2026-08-27 訂正。** ここは長らく「同梱スクリプトは別プロセスで動く独立した
# 実行ファイルで、`unbake/` からは import しない」と書いていたが、**0.1.2 以降は
# 同一プロセスで、`unbake/services/sync_script_runner.py` が普通に import している**。
# 記述だけが子プロセス時代のまま残っていた。
#
# つまり `tests/source_integrity_test.mjs` の import 検査が同梱物を見ていないのは、
# **「呼ばれないから」ではなく「相対 import を兄弟として除外しているから」**である
# （同ファイルの `if (dots) continue;`）。**免除の根拠が入れ替わっている**ので、
# 同梱スクリプトへ第三者パッケージが増えても、この検査は赤くならない。
# `requests` 以外を足すときは、宿主が供給するかを**人が**確かめること。
dependencies = []

[project.urls]
Repository = "https://github.com/syugoji/ComfyUI-Unbake"

[tool.comfy]
PublisherId = "syugoji"
DisplayName = "Unbake"
# Registry のカードに出る絵。**サイドバーの `icon.svg` とは別ファイル**
#（`web/icon-card.svg`）。
#
# **同じ物を指してはいけない**（2026-08-29 利用者の報告）。`icon.svg` は
# `mask-image` として当てるので中の色に意味が無く `#000` になっているが、
# ここは**普通の画像として描かれる**——暗いカードの上で実測 **1.52:1** で、
# ほぼ見えなかった。カード用は地の色が判らない場所で浮くよう板を敷いてある。
#
# **相対パスではなく URL でなければならない**——Registry はリポジトリを clone せず、
# この URL をそのまま読みに行く。だから `main` が動くと絵も動く。
# 版で固定したければ `main` をタグ名に変える。
Icon = "https://raw.githubusercontent.com/syugoji/ComfyUI-Unbake/main/web/icon-card.svg"
